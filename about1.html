  <body>
    <a class="home-link" href="index.html">Home</a>
    <main class="about">

        <div class="about-block about-block-left">
          <h1 id="about-heading">Global perspective.<br />Specialized<br />Expertise.</h1>
        </div>

      <section class="media" aria-label="Horizon Energy Group highlights">
        <video class="hero-video" autoplay muted loop playsinline poster="images/video-poster.jpg">

        <div class="image-grid">
          <img src="images/solarwind.jpg" alt="Renewable energy installation" />
          <img src="images/silhouette-gazing.jpg" alt="Silhouette gazing" />
